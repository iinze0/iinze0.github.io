<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>iinze0</title>
<meta name="description" content="T-Embed guide and Keylab keyboard configurator.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Instrument Sans', system-ui, sans-serif;
    background: #0e0e11;
    color: #eee;
    padding: 24px;
  }
  h1 { font-size: 1.1rem; font-weight: 500; letter-spacing: 0.04em; color: #888; margin: 0 0 32px; }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 16px;
    width: 100%;
    max-width: 640px;
  }
  a.card {
    display: block;
    padding: 28px 24px;
    border-radius: 16px;
    background: #16161a;
    border: 1px solid #2a2a30;
    color: inherit;
    text-decoration: none;
    transition: border-color .15s, transform .15s;
  }
  a.card:hover {
    border-color: #f5c518;
    transform: translateY(-2px);
  }
  a.card h2 { margin: 0 0 8px; font-size: 1.35rem; font-weight: 600; }
  a.card p { margin: 0; color: #999; font-size: 0.95rem; line-height: 1.45; }
  .accent { color: #f5c518; }
  footer { margin-top: 48px; font-size: 0.8rem; color: #555; }
  footer a { color: #777; }
</style>
</head>
<body>
  <h1>iinze0</h1>
  <div class="cards">
    <a class="card" href="tembed/">
      <h2>T-Embed</h2>
      <p>Guide for the LilyGO T-Embed CC1101 and Plus. Install, remote, antennas, firmware.</p>
    </a>
    <a class="card" href="keylab/">
      <h2>Keylab <span class="accent">·</span></h2>
      <p>Configure Attack Shark, Akko, Epomaker and other ROYUAN keyboards in the browser.</p>
    </a>
  </div>
  <footer>Finland · <a href="https://github.com/iinze0">GitHub</a></footer>
</body>
</html>
